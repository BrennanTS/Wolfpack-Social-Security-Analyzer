# .github/workflows/sweep.yml
#
# The invariant sweep (`npm run sweep`) is deliberately not in `npm test` or
# the pre-commit hook: it analyzes thousands of generated households. It went
# red on main for days without anyone noticing, because nothing ran it. This
# runs it nightly, and on demand from the Actions tab.
name: Invariant sweep

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Invariant sweep
        run: npm run sweep
